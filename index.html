<title>Daytime</title>
<style>
/* Layout: una columna de teléfono (Galaxy A23, ~412 px): cabecera, vista activa y barra inferior de 5 pestañas. Negro con azul marino; la paleta se cambia desde Ajustes. */
:root {
  color-scheme: dark;
  --bg: #04060c;
  --bg-2: #070c1a;
  --surface: #0a1226;
  --surface-2: #0e1a38;
  --navy: #12306b;
  --line: #1a2a52;
  --text: #e9eefa;
  --muted: #8693b5;
  --accent: #4d8bff;
  --accent-2: #2a5fd6;
  --accent-soft: color-mix(in srgb, var(--accent) 60%, #ffffff);
  --warn: #f5b84b;
  --glow: rgba(32, 76, 180, 0.32);
  --nav-bg: color-mix(in srgb, var(--bg) 93%, transparent);
  --scrim: rgba(0, 0, 0, 0.62);
  --font-display: "sans-serif-condensed", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --font-body: "Roboto", system-ui, "Segoe UI", sans-serif;
  --nav-h: 66px;
}
:root[data-pal="grafito"] { --bg: #060708; --bg-2: #0c0e11; --surface: #14171c; --surface-2: #1c2027; --navy: #2d3542; --line: #2a303a; --text: #eceff4; --muted: #8e98a8; --accent: #9fb4d1; --accent-2: #6b819e; --glow: rgba(120, 140, 170, 0.18); }
:root[data-pal="esmeralda"] { --bg: #030907; --bg-2: #06110d; --surface: #0a1a14; --surface-2: #0e2a1f; --navy: #11503a; --line: #1a3d2f; --text: #e8f5ef; --muted: #86a99b; --accent: #34d399; --accent-2: #15935f; --glow: rgba(20, 140, 95, 0.28); }
:root[data-pal="violeta"] { --bg: #07050d; --bg-2: #0d0a1a; --surface: #140f26; --surface-2: #1d1638; --navy: #3b2a7a; --line: #2c2354; --text: #efeafc; --muted: #9a90b8; --accent: #a78bfa; --accent-2: #6d4fe0; --glow: rgba(100, 60, 200, 0.3); }
:root[data-pal="carmesi"] { --bg: #0a0505; --bg-2: #140a0a; --surface: #1f0e10; --surface-2: #2e1215; --navy: #6b1a24; --line: #4a1f26; --text: #fbeaec; --muted: #b58f93; --accent: #ff6b78; --accent-2: #d92f44; --glow: rgba(190, 40, 60, 0.28); }

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(120% 50% at 50% -8%, var(--glow), transparent 62%);
  background-repeat: no-repeat;
  color: var(--text);
  font: 400 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }

.app { max-width: 480px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack.tight { gap: 4px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 8px; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { display: flex; align-items: center; justify-content: space-between; padding-block: 16px 14px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px var(--font-display); letter-spacing: 0.2em; text-transform: uppercase; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--navy), var(--accent-2)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.brand-mark .ic { width: 26px; height: 26px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); font: 600 13px var(--font-body); color: var(--muted); white-space: nowrap; }
.chip .ic { width: 18px; height: 18px; color: var(--accent); }

.h1 { font: 700 38px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
.h2 { font: 700 26px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; }
.eyebrow { font: 600 12px/1.2 var(--font-display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.eyebrow.acc { color: var(--accent); }
.num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }

.card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero { border-color: color-mix(in srgb, var(--accent-2) 55%, var(--line)); }

.btn { min-height: 50px; border-radius: 14px; border: 0; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px var(--font-body); letter-spacing: 0.02em; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn-warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.btn-block { width: 100%; }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); display: grid; place-items: center; font: 600 14px var(--font-body); }
.icon-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--accent-2); color: #fff; }

.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.3s; }

.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring > svg { transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; gap: 2px; }
.ring-c .ic { color: var(--accent-soft); }

.tile { text-decoration: none; color: inherit; align-items: center; text-align: center; gap: 8px; padding: 12px 6px; }
.tile .num { font-size: 24px; }

.fig { display: block; flex: none; }
.fig .m { fill: var(--line); }
.fig .m.on { fill: var(--accent); }

.seg { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 4px; padding: 4px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); }
.seg button { min-height: 46px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font: 600 15px var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; box-shadow: inset 0 0 0 1px var(--accent-2); }
.seg .ic { width: 20px; height: 20px; }

.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; width: 140px; min-height: 94px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg-2); text-align: left; display: flex; flex-direction: column; gap: 4px; justify-content: space-between; }
.day strong { font: 600 16px/1.15 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.day .small { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.day .small .ic { width: 16px; height: 16px; color: var(--accent); }
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent-2); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); padding: 10px 8px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.stat .num { font-size: 24px; }
.stat .ic { color: var(--accent-soft); width: 24px; height: 24px; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchips span { padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font: 600 12px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-soft); }

.ex-head { display: flex; align-items: center; gap: 12px; }
.ex-head h3 { font: 600 20px/1.15 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.ex-ic { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, var(--navy), var(--surface-2)); border: 1px solid var(--line); color: var(--accent-soft); flex: none; }
.ex-ic .ic { width: 32px; height: 32px; }
.tag { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.ok { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #04060c; flex: none; }
.ok .ic { width: 18px; height: 18px; stroke-width: 2.6; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 14px; }
.meta li { display: flex; align-items: center; gap: 6px; }
.meta .ic { width: 18px; height: 18px; color: var(--accent); }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); font: 700 18px var(--font-display); display: grid; place-items: center; }
.set .ic { width: 24px; height: 24px; stroke-width: 2.6; }
.set[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-color: var(--accent); color: #fff; }
.ex.full { border-color: var(--accent-2); }

.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); }
.stepper .num { font-size: 20px; text-align: center; flex: 1; white-space: nowrap; }
.rest[hidden], .scrim[hidden], .sheet[hidden] { display: none !important; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--accent-soft); }
.stepper button .ic { width: 20px; height: 20px; stroke-width: 2.2; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font: 600 12px var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); font: 500 16px var(--font-body); }
.field input::placeholder { color: color-mix(in srgb, var(--muted) 65%, transparent); }
.f3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.eqgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.eqgrid button { aspect-ratio: 1; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); display: grid; place-items: center; }
.eqgrid button .ic { width: 30px; height: 30px; }
.eqgrid button[aria-pressed="true"] { border-color: var(--accent); background: var(--navy); color: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-2); }

.macro { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: center; }
.macro .ic { color: var(--accent-soft); width: 26px; height: 26px; }
.macro .bar { grid-column: 2 / 4; height: 6px; }
.meal-h { display: flex; align-items: center; gap: 10px; }
.meal-h h3 { font: 600 20px var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.item { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.item .name { font-weight: 500; }
.item .kc { font: 700 18px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }

.chart text { font-family: var(--font-display); }
.chart .tick { fill: var(--muted); font-size: 13px; font-weight: 600; }
.chart .val { fill: var(--muted); font-size: 11px; font-weight: 600; }
.chart .val.now { fill: var(--text); }
.bar-n { fill: var(--navy); }
.bar-hit { fill: var(--accent); }
.bar-now { stroke: var(--text); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.dash { height: 0; width: 16px; border-radius: 0; border-top: 2px dashed var(--warn); }
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick-grid .btn { min-height: 48px; padding: 0 4px; font-size: 15px; }
.qw { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 76px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-2); padding: 8px 4px; }
.qw .ic { width: 30px; height: 30px; color: var(--accent-soft); }
.qw b { font: 700 16px var(--font-display); letter-spacing: 0.04em; }
.qw span { font-size: 12px; color: var(--muted); }

.bottle { width: 132px; flex: none; }
.bottle .glass { fill: var(--bg-2); }
.bottle .outline { fill: none; stroke: var(--accent); stroke-width: 2; }
.bottle .cap { fill: var(--navy); stroke: var(--accent); stroke-width: 1.5; }
.bottle .wt { font: 600 11px var(--font-display); fill: var(--muted); }
.bottle .tk { stroke: var(--text); stroke-opacity: 0.45; stroke-width: 1.2; }
.wv { fill: var(--accent); fill-opacity: 0.88; animation: wv 5s linear infinite; }
.wv2 { fill-opacity: 0.38; animation-duration: 7s; animation-direction: reverse; }
@keyframes wv { to { transform: translateX(-60px); } }

.quote-t { font: 600 27px/1.2 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.quote .ic.big { width: 38px; height: 38px; color: var(--accent); }

.rowset { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.rowset .ic { color: var(--accent-soft); width: 26px; height: 26px; }
.rowset .stepper { width: 168px; flex: none; }
.pals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pal { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--muted); font: 600 12px var(--font-body); }
.pal i { width: 100%; aspect-ratio: 1; max-width: 58px; border-radius: 16px; border: 1px solid var(--line); display: grid; place-items: center; color: #fff; }
.pal[aria-pressed="true"] { color: var(--text); }
.pal[aria-pressed="true"] i { outline: 2px solid var(--text); outline-offset: 2px; }
.pal i .ic { width: 22px; height: 22px; stroke-width: 2.6; opacity: 0; }
.pal[aria-pressed="true"] i .ic { opacity: 1; }
.switch { width: 54px; height: 32px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg-2); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform 0.2s, background 0.2s; }
.switch[aria-checked="true"] { background: var(--navy); border-color: var(--accent-2); }
.switch[aria-checked="true"]::after { transform: translateX(22px); background: var(--accent); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 0 max(4px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 480px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font: 600 11px var(--font-body); letter-spacing: 0.01em; text-align: center; min-width: 0; }
.tab .ic { width: 28px; height: 28px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 30px; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent); }

.rest { position: fixed; z-index: 30; left: 0; right: 0; margin: 0 auto; width: min(448px, calc(100% - 32px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px); display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--accent-2); }
.rest .num { font-size: 30px; min-width: 66px; }
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); font: 500 14px var(--font-body); white-space: nowrap; }
.err { color: var(--warn); font-size: 13px; min-height: 18px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>

  function figure(groups, w) {
    const f = new Set(), b = new Set();
    groups.forEach((g) => { const m = MAP[g]; if (m) { (m.f || []).forEach((x) => f.add(x)); (m.b || []).forEach((x) => b.add(x)); } });
    const c = (set, k) => 'm' + (set.has(k) ? ' on' : '');
    const pair = (set, k, d) => '<path class="' + c(set, k) + '" d="' + d + '"/><path class="' + c(set, k) + '" transform="matrix(-1 0 0 1 44 0)" d="' + d + '"/>';
    const one = (set, k, d) => '<path class="' + c(set, k) + '" d="' + d + '"/>';
    const front = '<g transform="translate(2 0)"><g class="m">' + D.head + '</g>' + pair(f, 'delt', D.delt) + pair(f, 'chest', D.chest) + pair(f, 'biceps', D.arm) + pair(f, 'x', D.fore) +
      one(f, 'core', D.abs) + pair(f, 'core', D.obl) + one(f, 'x', D.hip) + pair(f, 'quads', D.quad) + pair(f, 'calves', D.shin) + '</g>';
    const back = '<g transform="translate(54 0)"><g class="m">' + D.head + '</g>' + pair(b, 'delt', D.delt) + one(b, 'back', D.back) + one(b, 'lowback', D.low) + pair(b, 'triceps', D.arm) + pair(b, 'x', D.fore) +
      pair(b, 'glutes', D.glute) + pair(b, 'hams', D.ham) + pair(b, 'calves', D.calf) + '</g>';
    return '<svg class="fig" width="' + w + '" viewBox="0 0 100 112" aria-hidden="true">' + front + back + '</svg>';
  }

  /* ---------- Gráficos ---------- */
  function barChart(vals, goal, lab, aria) {
    const W = 340, H = 176, pl = 6, pr = 6, pt = 20, pb = 26, bw = 30, n = vals.length, gap = (W - pl - pr - n * bw) / (n - 1);
    const mx = Math.max.apply(null, vals.concat([goal * 1.15])), base = H - pb, ph = H - pt - pb, now = new Date();
    let bars = '';
    vals.forEach((v, i) => {
      const x = pl + i * (bw + gap), h = Math.max(2, v / mx * ph), y = base - h, last = i === n - 1;
      const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (n - 1 - i));
      const l = dt.toLocaleDateString(LOC(), { weekday: 'narrow' }).toUpperCase();
      bars += '<rect class="' + (v >= goal ? 'bar-hit' : 'bar-n') + (last ? ' bar-now' : '') + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw + '" height="' + h.toFixed(1) + '" rx="6"/>' +
        '<text class="val' + (last ? ' now' : '') + '" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle">' + lab(v) + '</text>' +
        '<text class="tick" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + l + '</text>';
    });
    const gy = (base - goal / mx * ph).toFixed(1);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(aria) + '"><line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)" stroke-width="1"/>' + bars +
      '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/></svg>';
  }
  function bottle(p, goal) {
    const pc = Math.max(0, Math.min(1, p)), top = 62, bot = 212, y = bot - (bot - top) * pc;
    const shape = 'M46 16V34C46 46 30 50 30 70V196A16 16 0 0 0 46 212H74A16 16 0 0 0 90 196V70C90 50 74 46 74 34V16Z';
    const wave = 'M-60 0q15-7 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0V240H-60z';
    let ticks = '';
    [0.25, 0.5, 0.75, 1].forEach((fr) => {
      const ty = bot - (bot - top) * fr;
      ticks += '<path class="tk" d="M30 ' + ty + 'h9"/><text class="wt" x="98" y="' + (ty + 4) + '">' + fmt(goal * fr) + '</text>';
    });
    return '<svg class="bottle" viewBox="0 0 150 222" role="img" aria-label="' + esc(t('bottle_aria', { n: Math.round(p * 100) })) + '"><defs><clipPath id="bclip"><path d="' + shape + '"/></clipPath></defs>' +
      '<rect class="cap" x="44" y="3" width="32" height="13" rx="3.500"/><path class="glass" d="' + shape + '"/>' +
      '<g clip-path="url(#bclip)"><g transform="translate(0 ' + y.toFixed(1) + ')"><path class="wv wv2" d="' + wave + '"/><path class="wv" d="' + wave + '" transform="translate(-20 3)"/></g></g>' +
      '<path class="outline" d="' + shape + '"/>' + ticks + '</svg>';
  }

  /* ---------- Vistas ---------- */
  function tile(href, label, ic, pct, val, sub) {

  const stepper = (val, act, extra, lblDec, lblInc, f) =>

  function viewRutina() {
    const P = plan(), d = P[S.sel], st = dayStats(d), dn = doneSets(S.sel);
    const seg = [3, 4, 5].map((n) => '<button type="button" data-act="plan" data-n="' + n + '" aria-pressed="' + (S.plan === n) + '">' + t('days_n', { n: n }) + '</button>').join('');

        '<ul class="meta"><li>' + I('repeat') + e.s + ' × ' + esc(e.r) + '</li><li>' + I('kettle') + esc(tr(e.l)) + '</li>' + (e.rest ? '<li>' + I('timer') + t('rest_l', { x: restTxt(e.rest) }) + '</li>' : '') + '</ul><div class="sets">' + sets + '</div></article>';

    const head = editing

  function viewAct() {

  function subSteps() {
    const G = S.goal.steps, vals = S.week.concat([S.steps]), pct = S.steps / G * 100, hits = vals.filter((v) => v >= G).length;
    const stat = (ic, v, u) => '<div class="stat">' + I(ic) + '<span class="num">' + v + '</span><span class="small">' + u + '</span></div>';
    return '<section class="card hero"><div class="row" style="gap:18px"><div class="ring">' + ring(pct, 150, 10) + '<div class="ring-c">' + I('sneaker') + '<span class="num" style="font-size:32px">' + fmt(S.steps) + '</span><span class="small">' + t('of_n', { n: fmt(G) }) + '</span></div></div>' +

        barChart(vals, G, (v) => dec1(v / 1000) + 'k', t('chart_steps', { n: fmt(G) })) +
        '<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>' + t('lg_hit') + '</span><span><i class="sw" style="background:var(--navy)"></i>' + t('lg_below') + '</span><span><i class="sw dash"></i>' + fmt(G) + '</span></div></section>' +
      '<section class="card"><span class="eyebrow">' + t('log_steps') + '</span><div class="quick-grid">' +
        '<button type="button" class="btn btn-ghost" data-act="steps" data-d="-500" aria-label="' + t('sub500') + '">−500</button>' +
        '<button type="button" class="btn btn-primary" data-act="steps" data-d="500">+500</button><button type="button" class="btn btn-primary" data-act="steps" data-d="1000">+1' + (S.lang === 'en' ? ',' : '.') + '000</button><button type="button" class="btn btn-primary" data-act="steps" data-d="2000">+2' + (S.lang === 'en' ? ',' : '.') + '000</button></div>' +
        '<p class="small">' + t('manual') + '</p></section>';
  }
  function subWater() {
    const G = S.goal.water, w = waterSum(), pct = w / G * 100, vals = S.wweek.concat([w]), hits = vals.filter((v) => v >= G).length, left = G - w;
    const log = S.water.slice().sort((a, b) => b.t - a.t).map((x) => '<div class="item"><span style="color:var(--accent-soft)">' + I(x.ml >= 500 ? 'bottle' : 'glass') + '</span><div class="grow"><span class="num" style="font-size:20px">' + fmt(x.ml) + '</span> <span class="small">ml</span></div><span class="small">' + new Date(x.t).toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit', hour12: false }) + '</span><button type="button" class="icon-btn" data-act="del-water" data-id="' + x.id + '" aria-label="' + esc(t('rm_entry', { n: x.ml })) + '">' + I('x') + '</button></div>').join('');
    const q = (ml, ic, lb) => '<button type="button" class="qw" data-act="water" data-ml="' + ml + '">' + I(ic) + '<b>+' + ml + '</b><span>' + lb + '</span></button>';
    return '<section class="card hero"><div class="row" style="gap:14px">' + bottle(w / G, G) +
        '<div class="stack tight grow" style="gap:8px"><span class="eyebrow">' + t('water_today') + '</span><span class="num" style="font-size:44px">' + fmt(w) + '</span><span class="small">' + t('of_n', { n: fmt(G) }) + ' ml · ' + Math.round(pct) + '%</span>' +
        '<span class="chip" style="align-self:flex-start">' + I('drop') + (left > 0 ? t('water_left', { n: fmt(left) }) : t('goal_met')) + '</span><span class="small">' + t('water_glasses', { n: dec1(w / 250) }) + '</span></div></div></section>' +
      '<section class="card"><span class="eyebrow">' + t('add_water') + '</span><div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:8px">' + q(250, 'glass', t('glass')) + q(500, 'bottle', t('bottle')) + q(750, 'bottle', t('bottle')) + '</div>' +
        '<form id="waterForm" class="row" style="align-items:flex-end" novalidate><div class="field grow"><label for="wml">' + t('other_amt') + '</label><input id="wml" type="number" inputmode="numeric" min="10" max="3000" placeholder="300"></div><button type="submit" class="btn btn-primary" style="min-height:48px" aria-label="' + t('add') + '">' + I('plus') + '</button></form></section>' +
      '<section class="card"><div class="row between"><span class="eyebrow">' + t('last7') + '</span><span class="chip">' + I('trophy') + t('hits', { a: hits }) + '</span></div>' +
        barChart(vals, G, (v) => dec1(v / 1000), t('chart_water', { n: fmt(G) })) +
        '<div class="legend"><span><i class="sw" style="background:var(--accent)"></i>' + t('lg_hit') + '</span><span><i class="sw" style="background:var(--navy)"></i>' + t('lg_below') + '</span><span><i class="sw dash"></i>' + fmt(G) + ' ml</span></div></section>' +
      '<section class="card"><span class="eyebrow">' + t('water_log') + '</span>' + (log || '<p class="small">' + t('no_water') + '</p>') + '</section>';
  }

  function viewSet() {
    const g = S.goal;
    const gr = (ic, label, val, key, unit) => '<div class="rowset"><div class="row" style="gap:12px">' + I(ic) + '<span>' + label + '</span></div>' +
      '<div class="stepper"><button type="button" data-act="goal" data-k="' + key + '" data-d="-1" data-f="g' + key + 'a" aria-label="' + esc(t('dec', { n: label })) + '">' + I('minus') + '</button><span class="num">' + fmt(val) + (unit ? '<small style="font-size:12px;color:var(--muted)"> ' + unit + '</small>' : '') + '</span><button type="button" data-act="goal" data-k="' + key + '" data-d="1" data-f="g' + key + 'b" aria-label="' + esc(t('inc', { n: label })) + '">' + I('plus') + '</button></div></div>';
    const pals = PALS.map((p) => '<button type="button" class="pal" data-act="pal" data-p="' + p + '" aria-pressed="' + (S.pal === p) + '"><i style="background:linear-gradient(145deg,' + PAL_SW[p][0] + ',' + PAL_SW[p][1] + ')">' + I('check') + '</i>' + t('pal_' + p) + '</button>').join('');
    const danger = (key, title, desc) => '<div class="rowset"><div class="grow"><div>' + title + '</div><div class="small">' + (ui.pend === key ? t('confirm') : desc) + '</div></div><button type="button" class="btn ' + (ui.pend === key ? 'btn-warn' : 'btn-ghost') + '" style="min-height:44px" data-act="reset" data-k="' + key + '">' + I(ui.pend === key ? 'check' : 'refresh') + '</button></div>';
    return '<div class="stack"><div class="stack tight"><p class="eyebrow">' + t('set_sub') + '</p><h1 class="h1">' + t('set_h') + '</h1></div>' +
      '<section class="card"><span class="eyebrow">' + t('profile') + '</span><div class="row" style="gap:12px">' + I('user') + '<div class="field grow"><label for="s-name">' + t('your_name') + '</label><input id="s-name" type="text" maxlength="24" data-edit="name" placeholder="' + esc(t('name_ph')) + '" value="' + esc(S.name) + '"></div></div></section>' +
      '<section class="card"><div class="row" style="gap:10px"><span style="color:var(--accent-soft)">' + I('globe') + '</span><span class="eyebrow">' + t('language') + '</span></div><div class="seg" style="--cols:2" role="group" aria-label="' + t('language') + '">' +
        '<button type="button" data-act="lang" data-l="es" aria-pressed="' + (S.lang === 'es') + '">Español</button><button type="button" data-act="lang" data-l="en" aria-pressed="' + (S.lang === 'en') + '">English</button></div></section>' +
      '<section class="card"><div class="row" style="gap:10px"><span style="color:var(--accent-soft)">' + I('palette') + '</span><span class="eyebrow">' + t('appearance') + ' · ' + t('app_color') + '</span></div><div class="pals">' + pals + '</div></section>' +
      '<section class="card"><span class="eyebrow">' + t('goals') + '</span>' + gr('flame', t('calories'), g.kcal, 'kcal', 'kcal') + gr('sneaker', t('steps'), g.steps, 'steps', '') + gr('drop', t('water'), g.water, 'water', 'ml') + '</section>' +
      '<section class="card"><span class="eyebrow">' + t('training') + '</span><div class="rowset" style="border-top:0;padding-top:0"><div class="row grow" style="gap:12px">' + I('timer') + '<div><div>' + t('rest_timer') + '</div><div class="small">' + t('rest_timer_d') + '</div></div></div>' +
        '<button type="button" class="switch" role="switch" data-act="rest-toggle" aria-checked="' + S.rest + '" aria-label="' + t('rest_timer') + '"></button></div></section>' +
      '<section class="card"><span class="eyebrow">' + t('data') + '</span>' + danger('plans', t('reset_plans'), t('reset_plans_d')) + danger('all', t('reset_all'), t('reset_all_d')) + '</section>' +
      '<p class="note">' + t('foot') + '</p></div>';
  }

  /* ---------- Render ---------- */
  const VIEWS = { hoy: viewHoy, rutina: viewRutina, calorias: viewCal, actividad: viewAct, ajustes: viewSet };
  const TABS = [['hoy', 'today', 'nav_hoy'], ['rutina', 'barbell', 'nav_rutina'], ['calorias', 'flame', 'nav_cal'], ['actividad', 'sneaker', 'nav_act'], ['ajustes', 'gear', 'nav_aj']];
  const ui = { edit: false, pend: null };
  let tab = 'hoy', lastFocus = null;
  function route() { const h = (location.hash || '#hoy').slice(1); tab = VIEWS[h] ? h : 'hoy'; ui.edit = false; ui.pend = null; }
  function render() {
    $('#view').innerHTML = VIEWS[tab]();
    $('#planChip').innerHTML = I('target') + t('plan_chip', { n: S.plan });
    $('#nav').setAttribute('aria-label', t('sections'));
    $('#nav').innerHTML = '<div class="nav-in">' + TABS.map((x) => '<a class="tab" href="#' + x[0] + '"' + (x[0] === tab ? ' aria-current="page"' : '') + '>' + I(x[1]) + t(x[2]) + '</a>').join('') + '</div>';
    if (lastFocus) { const el = document.querySelector('[data-f="' + lastFocus + '"]'); if (el) el.focus({ preventScroll: true }); lastFocus = null; }
  }

  /* ---------- Descanso ---------- */
  let rest = null, timer = null;
  function restTick() {
    if (!rest) return;
    $('#restT').textContent = Math.floor(rest.left / 60) + ':' + pad(rest.left % 60);
    $('#restB').style.width = (rest.left / rest.total * 100) + '%';
  }
  function stopRest() { clearInterval(timer); rest = null; $('#rest').hidden = true; $('#rest').innerHTML = ''; }
  function startRest(sec, name) {
    if (!sec || !S.rest) return;
    clearInterval(timer);
    rest = { left: sec, total: sec };
    const el = $('#rest');
    el.hidden = false;
    el.innerHTML = '<span class="num" id="restT">0:00</span><div class="grow"><div class="small" style="margin-bottom:6px">' + esc(t('rest_t', { n: name })) + '</div><div class="bar"><i id="restB" style="width:100%"></i></div></div>' +
      '<button type="button" class="icon-btn" data-act="rest-add" aria-label="' + t('rest_add') + '">+15</button><button type="button" class="icon-btn" data-act="rest-stop" aria-label="' + t('rest_skip') + '">' + I('x') + '</button>';
    restTick();
    timer = setInterval(() => { rest.left--; if (rest.left <= 0) stopRest(); else restTick(); }, 1000);
  }

  /* ---------- Hojas ---------- */
  let sheetTrigger = null, pickIc = 'dumbbell';
  function showSheet(html, trigger, focusId) {
    sheetTrigger = trigger || null;
    $('#sheet').innerHTML = html;
    $('#scrim').hidden = false; $('#sheet').hidden = false;
    const f = $(focusId); if (f) f.focus();
  }
  function closeSheet() {
    $('#scrim').hidden = true; $('#sheet').hidden = true; $('#sheet').innerHTML = '';
    if (sheetTrigger && document.body.contains(sheetTrigger)) sheetTrigger.focus({ preventScroll: true });
    sheetTrigger = null;
  }
  const sheetHead = (title) => '<div class="row between"><h2 class="h2" id="sheetT">' + title + '</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="' + t('close') + '">' + I('x') + '</button></div>';
  function openMeal(meal, trigger) {
    const opts = MEALS.map((m) => '<option value="' + m.k + '"' + (m.k === meal ? ' selected' : '') + '>' + t('m_' + m.k) + '</option>').join('');
    const quick = QUICK.map((q, i) => '<button type="button" data-act="quick" data-q="' + i + '">' + esc(tr(q.n)) + ' · ' + q.kcal + '</button>').join('');
    showSheet('<form id="mealForm" class="sheet-in" autocomplete="off" novalidate>' + sheetHead(t('add_food')) + '<div class="quick" aria-label="' + t('frequent') + '">' + quick + '</div>' +
      '<div class="field"><label for="fmeal">' + t('meal_f') + '</label><select id="fmeal">' + opts + '</select></div>' +
      '<div class="field"><label for="fname">' + t('food_f') + '</label><input id="fname" type="text" placeholder="' + esc(t('food_ph')) + '" maxlength="60"></div>' +
      '<div class="field"><label for="fkcal">' + t('kcal_f') + '</label><input id="fkcal" type="number" inputmode="numeric" min="0" max="5000" placeholder="0"></div>' +
      '<div class="f3"><div class="field"><label for="fp">' + t('p_f') + '</label><input id="fp" type="number" inputmode="decimal" min="0" placeholder="0"></div><div class="field"><label for="fc">' + t('c_f') + '</label><input id="fc" type="number" inputmode="decimal" min="0" placeholder="0"></div><div class="field"><label for="ff">' + t('f_f') + '</label><input id="ff" type="number" inputmode="decimal" min="0" placeholder="0"></div></div>' +
      '<p class="err" id="ferr" role="alert"></p><button type="submit" class="btn btn-primary btn-block">' + I('plus') + t('add') + '</button></form>', trigger, '#fname');
  }
  function openEx(trigger) {
    pickIc = 'dumbbell';
    const mus = MUSCLES.map((m) => '<option value="' + m + '">' + esc(tr(m)) + '</option>').join('');
    const eq = EQUIP.map((q) => '<button type="button" data-act="pick-eq" data-ic="' + q + '" aria-pressed="' + (q === pickIc) + '" aria-label="' + t('eq_' + q) + '">' + I(q) + '</button>').join('');
    showSheet('<form id="exForm" class="sheet-in" autocomplete="off" novalidate>' + sheetHead(t('add_ex')) +
      '<div class="field"><label for="xn">' + t('f_ex') + '</label><input id="xn" type="text" maxlength="60" placeholder="' + esc(t('ex_ph')) + '"></div>' +
      '<div class="f3"><div class="field"><label for="xs">' + t('f_sets') + '</label><input id="xs" type="number" inputmode="numeric" min="1" max="10" value="3"></div><div class="field"><label for="xr">' + t('f_reps') + '</label><input id="xr" type="text" maxlength="12" value="10" placeholder="' + esc(t('reps_ph')) + '"></div><div class="field"><label for="xrest">' + t('f_rest') + ' (s)</label><input id="xrest" type="number" inputmode="numeric" min="0" max="600" value="60"></div></div>' +
      '<div class="field"><label for="xl">' + t('f_load') + '</label><input id="xl" type="text" maxlength="24" placeholder="' + esc(t('load_ph')) + '"></div>' +
      '<div class="field"><label for="xm">' + t('f_muscle') + '</label><select id="xm">' + mus + '</select></div>' +
      '<div class="field"><span class="lbl">' + t('f_equip') + '</span><div class="eqgrid">' + eq + '</div></div>' +
      '<p class="err" id="ferr" role="alert"></p><button type="submit" class="btn btn-primary btn-block">' + I('plus') + t('add') + '</button></form>', trigger, '#xn');
  }
  function reindexDone(j) {
    const pre = S.plan + '.' + S.sel + '.', n = plan()[S.sel].ex.length, old = {};
    for (let k = 0; k <= n; k++) { old[k] = S.done[pre + k]; delete S.done[pre + k]; }
    for (let k = 0; k <= n; k++) { if (k === j || old[k] == null) continue; S.done[pre + (k > j ? k - 1 : k)] = old[k]; }
  }

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = e.target.id;
    if (id === 'mealForm') {
      const name = $('#fname').value.trim(), kcal = parseFloat($('#fkcal').value);
      if (!name) { $('#ferr').textContent = t('err_name'); $('#fname').focus(); return; }
      if (!(kcal >= 0) || kcal > 5000) { $('#ferr').textContent = t('err_kcal'); $('#fkcal').focus(); return; }
      const num = (x) => { const v = parseFloat($('#' + x).value); return v > 0 ? v : 0; };
      S.meals.push({ id: Date.now(), meal: $('#fmeal').value, name: name, kcal: Math.round(kcal), p: num('fp'), c: num('fc'), f: num('ff') });
      save(); closeSheet(); render();
    } else if (id === 'exForm') {
      const name = $('#xn').value.trim();
      if (!name) { $('#ferr').textContent = t('err_ex'); $('#xn').focus(); return; }
      const s = Math.max(1, Math.min(10, parseInt($('#xs').value, 10) || 3)), rs = Math.max(0, Math.min(600, parseInt($('#xrest').value, 10) || 0));
      plan()[S.sel].ex.push(E(name, s, $('#xr').value.trim() || '10', $('#xl').value.trim() || PC, rs, $('#xm').value, pickIc));
      save(); closeSheet(); render();
    } else if (id === 'waterForm') {
      const ml = Math.round(parseFloat($('#wml').value));
      if (!(ml >= 10 && ml <= 3000)) { $('#wml').focus(); return; }
      S.water.push({ id: Date.now(), ml: ml, t: Date.now() });
      save(); render();
    }
  });

  /* ---------- Acciones ---------- */
  const GSTEP = { kcal: [100, 1200, 5000], steps: [500, 2000, 30000], water: [250, 1000, 6000] };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act, ds = b.dataset;
    if (a === 'plan') { S.plan = +ds.n; S.sel = 0; S.cur = 0; ui.edit = false; stopRest(); }
    else if (a === 'sel') { S.sel = +ds.i; }
    else if (a === 'set') {
      const i = +ds.i, j = +ds.j, k = +ds.k, ex = plan()[i].ex[j], cur = S.done[dk(i, j)] || 0, next = (k + 1 === cur) ? k : k + 1;
      S.done[dk(i, j)] = next;
      if (next > cur) startRest(ex.rest, tr(ex.n));
      lastFocus = ds.f;
    }
    else if (a === 'finish') {
      plan()[S.sel].ex.forEach((x, j) => { delete S.done[dk(S.sel, j)]; });
      S.cur = (S.sel + 1) % plan().length; S.sel = S.cur; stopRest(); window.scrollTo(0, 0);
    }
    else if (a === 'toggle-edit') { ui.edit = !ui.edit; stopRest(); }
    else if (a === 'ex-sets') { const ex = plan()[S.sel].ex[+ds.j]; ex.s = Math.max(1, Math.min(10, ex.s + (+ds.d))); lastFocus = ds.f; }
    else if (a === 'ex-rest') { const ex = plan()[S.sel].ex[+ds.j]; ex.rest = Math.max(0, Math.min(600, (ex.rest || 0) + 15 * (+ds.d))); lastFocus = ds.f; }
    else if (a === 'del-ex') { const j = +ds.j; plan()[S.sel].ex.splice(j, 1); reindexDone(j); }
    else if (a === 'add-ex') { openEx(b); return; }
    else if (a === 'pick-eq') { pickIc = ds.ic; document.querySelectorAll('.eqgrid button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.ic === pickIc))); return; }
    else if (a === 'quote') { S.q++; }
    else if (a === 'add-meal') { openMeal(ds.meal, b); return; }
    else if (a === 'close-sheet') { closeSheet(); return; }
    else if (a === 'quick') {
      const q = QUICK[+ds.q];
      $('#fname').value = tr(q.n); $('#fkcal').value = q.kcal; $('#fp').value = q.p; $('#fc').value = q.c; $('#ff').value = q.f; $('#ferr').textContent = ''; return;
    }
    else if (a === 'del-meal') { const id = +ds.id; S.meals = S.meals.filter((m) => m.id !== id); }
    else if (a === 'act') { S.act = ds.v; }
    else if (a === 'steps') { S.steps = Math.max(0, S.steps + (+ds.d)); }
    else if (a === 'water') { S.water.push({ id: Date.now(), ml: +ds.ml, t: Date.now() }); }
    else if (a === 'del-water') { const id = +ds.id; S.water = S.water.filter((x) => x.id !== id); }
    else if (a === 'lang') { S.lang = ds.l; applyTheme(); }
    else if (a === 'pal') { S.pal = ds.p; applyTheme(); }
    else if (a === 'goal') {
      const g = GSTEP[ds.k]; S.goal[ds.k] = Math.max(g[1], Math.min(g[2], S.goal[ds.k] + g[0] * (+ds.d))); lastFocus = ds.f;
    }
    else if (a === 'rest-toggle') { S.rest = !S.rest; if (!S.rest) stopRest(); }
    else if (a === 'reset') {
      if (ui.pend !== ds.k) { ui.pend = ds.k; render(); return; }
      if (ds.k === 'plans') { S.plans = clone(PLANS); S.done = {}; S.sel = 0; S.cur = 0; stopRest(); }
      else { stopRest(); S = fresh(); applyTheme(); }
      ui.pend = null;
    }
    else if (a === 'rest-stop') { stopRest(); return; }
    else if (a === 'rest-add') { if (rest) { rest.left += 15; rest.total += 15; restTick(); } return; }
    save(); render();
  });
  document.addEventListener('input', (e) => {
    const el = e.target, k = el.dataset && el.dataset.edit;
    if (!k || el.tagName === 'SELECT') return;
    if (k === 'name') S.name = el.value;
    else if (k === 'dn') plan()[S.sel].n = el.value;
    else { const ex = plan()[S.sel].ex[+el.dataset.j]; if (ex) ex[k] = el.value; }
    save();
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.tagName !== 'SELECT' || !el.dataset.edit) return;
    const ex = plan()[S.sel].ex[+el.dataset.j]; if (ex) ex[el.dataset.edit] = el.value;
    save(); lastFocus = null; render();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
  window.addEventListener('hashchange', () => { route(); render(); window.scrollTo(0, 0); });

  applyTheme(); route(); render();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
